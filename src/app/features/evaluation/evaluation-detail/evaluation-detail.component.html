@if (isLoading()) {
  <app-spinner />
} @else {
  @if (evaluation(); as ev) {
  <!-- Tab Navigation -->
  <div class="tab-navigation">
    <button 
      class="tab-btn"
      [class.active]="activeTab() === 'analysis'"
      (click)="setTab('analysis')">
      Análisis
    </button>
    <button 
      class="tab-btn"
      [class.active]="activeTab() === 'player'"
      (click)="setTab('player')">
      Video + Transcripción
    </button>
  </div>

  <!-- Tab Content -->
  @if (activeTab() === 'analysis') {
    <app-evaluation-analysis [evalutationId]="ev.id" />
    <app-evaluation-form
      [isEditing]="true"
      [byZone]="
        ev.location === null || ev.location === 'null'
          ? false
          : true
      "
      [disabled]="true"
      [campaign]="ev.campaign"
      [evaluation]="ev" />
  } @else {
    <app-interaction-player 
      [evaluationId]="ev.id"
      [videoUrl]="ev.video?.url || null"
      [initialSeekSeconds]="seekFromRoute()" />
  }
  } @else {
  <div class="detail-error-state">
    <p>No se pudo cargar esta evaluación.</p>
    <button type="button" class="back-link-btn" (click)="backToList()">
      Volver al listado
    </button>
  </div>
  }
}
