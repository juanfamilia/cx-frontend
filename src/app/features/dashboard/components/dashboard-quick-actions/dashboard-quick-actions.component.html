<div
  class="dark:bg-bunker-900/40 dark:border-bunker-900 rounded-lg border border-gray-300 bg-white p-6 py-4 shadow-xs">
  <h3 class="text-xl font-semibold tracking-tight text-gray-900 dark:text-gray-100">
    {{ heading() }}
  </h3>
  @if (description()) {
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
      {{ description() }}
    </p>
  }
  <div class="mt-4 flex flex-col gap-3">
    @for (action of actions(); track $index) {
      <button
        type="button"
        (click)="goTo(action.route)"
        [class]="
          action.variant === 'primary'
            ? 'inline-flex h-11 w-full cursor-pointer items-center justify-start gap-2 rounded-md border border-primary-600 bg-primary-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-primary-700 dark:border-primary-500 dark:bg-primary-600 dark:hover:bg-primary-500'
            : 'dark:bg-bunker-900/60 dark:hover:bg-bunker-900/90 dark:border-bunker-900 inline-flex h-10 w-full cursor-pointer items-center justify-start gap-2 rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium whitespace-nowrap transition-colors hover:bg-gray-100'
        ">
        <ng-icon [name]="action.icon" strokeWidth="1.5" size="20" />
        {{ action.title }}
      </button>
    }
  </div>
</div>
