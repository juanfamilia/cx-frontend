<div class="mx-auto max-w-7xl px-4 py-6">
  <nav class="mb-4 text-sm">
    <a routerLink="/field/projects" class="font-medium text-indigo-600 hover:underline dark:text-indigo-400"
      >← Proyectos</a
    >
    <span class="mx-2 text-slate-400">/</span>
    <a routerLink="/field/trabajo" class="text-slate-600 hover:underline dark:text-slate-400">Tablero completo</a>
  </nav>

  @if (loadError()) {
    <p class="mb-4 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900 dark:border-amber-800 dark:bg-amber-950/40 dark:text-amber-100">
      {{ loadError() }}
    </p>
  }

  <header class="border-b border-slate-200 pb-4 dark:border-slate-700">
    <p class="text-xs font-semibold uppercase tracking-wide text-indigo-600 dark:text-indigo-400">7Field — control</p>
    <h1 class="mt-1 text-2xl font-bold text-slate-900 dark:text-slate-50">{{ projectName() }}</h1>
    <div class="mt-4 flex flex-wrap gap-2">
      @for (t of tabs(); track t.link) {
        <a
          [routerLink]="t.link"
          routerLinkActive="bg-indigo-600 text-white dark:bg-indigo-500"
          class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-800 hover:bg-slate-50 dark:border-slate-600 dark:text-slate-100 dark:hover:bg-slate-800 [&.active]:border-transparent">
          {{ t.label }}
        </a>
      }
    </div>
  </header>

  <div class="mt-6">
    <router-outlet />
  </div>
</div>
