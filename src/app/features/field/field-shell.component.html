<div class="mx-auto max-w-7xl px-4 py-6">
  <app-field-primary-nav-tabs class="mb-5" />

  <nav class="mb-4 flex flex-wrap items-center gap-x-2 gap-y-1 text-sm text-slate-600 dark:text-slate-400">
    <a routerLink="/field/projects" class="font-medium text-indigo-600 hover:underline dark:text-indigo-400"
      >Resumen de proyectos</a
    >
    <span class="text-slate-300 dark:text-slate-600" aria-hidden="true">/</span>
    <span class="text-slate-800 dark:text-slate-200">{{ projectName() }}</span>
    <span class="mx-1 text-slate-300 dark:text-slate-600">·</span>
    <a routerLink="/field/trabajo" queryParamsHandling="" class="hover:underline">Operaciones y Asistente</a>
  </nav>

  @if (loadError()) {
    <p class="mb-4 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900 dark:border-amber-800 dark:bg-amber-950/40 dark:text-amber-100">
      {{ loadError() }}
    </p>
  }

  <header class="border-b border-slate-200 pb-5 dark:border-slate-700">
    <p class="text-xs font-semibold uppercase tracking-wide text-indigo-600 dark:text-indigo-400">
      Siete Field — detalle de proyecto
    </p>
    <h1 class="mt-1 text-2xl font-bold tracking-tight text-slate-900 dark:text-slate-50">{{ projectName() }}</h1>
    <p class="mt-2 max-w-2xl text-sm text-slate-600 dark:text-slate-400">
      Priorice hallazgos y métricas sin perder el contexto del proyecto.
    </p>
    <div class="mt-5 flex flex-wrap gap-2">
      @for (t of tabs(); track t.link) {
        <a
          [routerLink]="t.link"
          routerLinkActive="bg-indigo-600 text-white shadow-sm dark:bg-indigo-500"
          class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-800 transition-colors hover:bg-slate-50 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 dark:hover:bg-slate-800 [&.active]:border-transparent [&.active]:hover:bg-indigo-600 dark:[&.active]:hover:bg-indigo-500">
          {{ t.label }}
        </a>
      }
    </div>
  </header>

  <div class="mt-8">
    <router-outlet />
  </div>
</div>
